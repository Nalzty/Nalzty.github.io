  <script>
    (() => {
      let started = false;
      const sound = document.getElementById('sound');

      document.addEventListener('click', async () => {
        if (started) return;
        started = true;

        // Максимальная громкость элемента и программное усиление аудиосигнала.
        sound.volume = 1;
        sound.loop = true;

        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            const audioContext = new AudioContextClass();
            const source = audioContext.createMediaElementSource(sound);
            const gain = audioContext.createGain();
            gain.gain.value = 3; // Усиление примерно в 3 раза; может добавить искажения.
            source.connect(gain);
            gain.connect(audioContext.destination);
            await audioContext.resume();
          }
          await sound.play();
        } catch (error) {
          // Если усиление недоступно, пробуем обычное воспроизведение.
          console.error('Усиление аудио недоступно:', error);
          try { await sound.play(); } catch (playError) {
            console.error('Не удалось запустить звук:', playError);
          }
        }

        // Быстрое циклическое переключение фона.
        setInterval(() => {
          document.body.classList.toggle('white-mode');
        }, 20);
      }, { once: true });
    })();
  </script>
